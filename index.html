<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a6e">
<title>학술제 운영</title>
<style>
:root{
  --bg:#ffffff;--card:#f4f6fb;--text:#1b2433;--sub:#667085;--line:#e2e7f0;
  --navy:#1f3a6e;--navy-t:#1f3a6e;--on-navy:#ffffff;
  --green:#17a05d;--green-bg:#e6f6ed;
  --orange:#e8710a;--orange-bg:#fff2e5;
  --gray:#98a1b0;
  --red:#e5322d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131d;--card:#18202f;--text:#e9edf5;--sub:#9aa5b8;--line:#2a3447;
    --navy:#3d63b8;--navy-t:#9bb8ff;--on-navy:#ffffff;
    --green:#37c47c;--green-bg:#12301f;
    --orange:#ff9a3c;--orange-bg:#33210e;
    --gray:#6b7587;
    --red:#ff6b66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0e131d;--card:#18202f;--text:#e9edf5;--sub:#9aa5b8;--line:#2a3447;
    --navy:#3d63b8;--navy-t:#9bb8ff;--on-navy:#ffffff;
    --green:#37c47c;--green-bg:#12301f;
    --orange:#ff9a3c;--orange-bg:#33210e;
    --gray:#6b7587;
    --red:#ff6b66;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{zoom:.88;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.top{
  position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.top .t1{font-weight:800;font-size:18px;color:var(--navy-t);line-height:1.2}
.top .t2{font-size:13px;color:var(--sub)}
.hr{display:flex;align-items:center;gap:8px}
.tg{width:44px;height:44px;border-radius:22px;border:2px solid var(--navy);color:var(--navy-t);background:var(--bg);display:flex;align-items:center;justify-content:center}
.tg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{min-height:44px;padding:0 14px;border-radius:22px;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:16px}
main{padding:16px}
h2{font-size:20px;margin:24px 0 10px;color:var(--navy-t)}
h2:first-child{margin-top:0}
h3{font-size:17px;margin:0 0 6px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.sub{color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:15px;margin:4px 0}

/* name picker */
.pick{padding:24px 16px}
.pick h1{font-size:30px;margin:12px 0 4px;color:var(--navy-t)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.nbtn{min-height:64px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:20px;font-weight:800;padding:8px;text-align:center}
.nbtn small{display:block;font-size:13px;font-weight:500;color:var(--sub)}
.nbtn.cur{border-color:var(--navy);color:var(--navy-t)}
.ghost{min-height:48px;width:100%;margin-top:14px;border-radius:14px;border:2px solid var(--line);font-weight:700}

/* home */
.home{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.hbtn{height:118px;border-radius:18px;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px;text-align:center}
.hbtn.alt{background:var(--card);color:var(--navy-t);border:3px solid var(--navy)}
.hbtn svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn b{font-size:24px;font-weight:900}
.hbtn span{font-size:15px;opacity:.9}
.top{position:sticky}
.menu{position:absolute;right:12px;top:100%;margin-top:6px;width:200px;max-height:70vh;overflow:auto;background:var(--bg);border:2px solid var(--navy);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px}
.mi{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-radius:10px;font-size:18px;font-weight:700;text-align:left}
.mi small{font-size:13px;font-weight:500;color:var(--sub)}
.mi.cur{background:var(--navy);color:var(--on-navy)}
.mi.cur small{color:var(--on-navy);opacity:.8}
.acc{border:2px solid var(--navy);border-radius:16px;margin-bottom:10px;background:var(--bg);overflow:hidden}
.ah{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:20px;font-weight:800;color:var(--navy-t);text-align:left}
.ah i{width:12px;height:12px;border:solid var(--navy-t);border-width:0 3px 3px 0;transform:rotate(45deg);margin:-6px 4px 0 0;transition:transform .15s}
.acc.open .ah i{transform:rotate(-135deg);margin-top:6px}
.ab{display:none;padding:0 16px 12px}
.acc.open .ab{display:block}
.bn{display:block;width:100%;text-align:left;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card)}
.bn .bl{font-weight:800;margin-bottom:6px}
.bn img{display:block;width:100%;height:auto;border-radius:6px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.lbx{align-self:flex-end;margin:calc(12px + env(safe-area-inset-top)) 16px 8px;min-height:48px;padding:0 18px;border-radius:24px;background:#fff;color:#111;font-weight:800}
.lbs{flex:1;overflow:auto;display:flex;align-items:center;-webkit-overflow-scrolling:touch}
.lbs img{width:1300px;max-width:none;height:auto;display:block;margin:0 auto}
.vm{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.vm svg{display:block;width:100%;height:auto;max-width:240px;margin:0 auto 12px}
.vl{font-size:16px;padding:3px 0;display:flex;align-items:center;gap:8px}
.vl .sw{flex:0 0 18px;height:18px;border-radius:5px}
.vl .sw.dash{background:none;border:2px dashed var(--text);height:0;border-radius:0;align-self:center}
.il{padding:12px 0;border-top:1px solid var(--line)}
.ik{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:2px}
.iv{font-size:20px;font-weight:800;line-height:1.35}
.il .in{font-size:15px;color:var(--sub);margin-top:2px}
.il:first-of-type{border-top:0}
.back{min-height:48px;padding:0 14px;margin:0 0 12px -6px;font-weight:800;font-size:17px;color:var(--navy-t)}
/* tabs */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:10;
  background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;color:var(--sub)}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--navy-t)}

/* badges */
.chip,.tbd,.flag,.tag{display:inline-block;font-size:14px;line-height:1.3;padding:3px 9px;border-radius:999px;margin:2px 4px 2px 0}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--text)}
.chip.me{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip.ext{color:var(--sub)}
.tbd{border:2px dashed var(--orange);color:var(--orange);background:transparent;font-weight:700;padding:1px 8px}
.flag{background:var(--orange-bg);color:var(--orange);font-weight:700}
.tag{background:var(--navy);color:var(--on-navy);font-weight:700}
.tag.p2{background:var(--bg);color:var(--navy-t);border:2px solid var(--navy);padding:1px 8px}
.tag.green{background:var(--green);color:#fff}
.tag.gray{background:var(--gray);color:#fff}
.tag.org{background:var(--orange);color:#fff}
.owners{margin-top:4px}

/* now tab */
.big{border-radius:20px;padding:20px;margin-bottom:12px;background:var(--card);border:2px solid transparent}
.big.now{border-color:var(--green);background:var(--green-bg)}
.big .lbl{font-size:15px;font-weight:800;color:var(--sub)}
.big.now .lbl{color:var(--green)}
.big .bt{font-size:20px;font-weight:700;margin-top:4px}
.big .bn{font-size:28px;font-weight:800;line-height:1.3;margin:2px 0 6px}
.big .bp{font-size:18px;font-weight:700;color:var(--navy-t)}
.big.nxt .bn{font-size:24px}
.mine{margin-top:12px;background:var(--bg);border-left:6px solid var(--orange);border-radius:10px;padding:10px 12px}
.mine b{color:var(--orange)}
.mine div{margin-top:2px;font-size:17px}
.dday{text-align:center;padding:24px 16px;border-radius:20px;background:var(--navy);color:var(--on-navy);margin-bottom:12px}
.dday .dd{font-size:64px;font-weight:900;line-height:1.1}
.dday .dl{font-size:16px;opacity:.85}
.warn{background:var(--orange-bg);border:2px solid var(--orange);color:var(--text);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.warn b{color:var(--orange)}

/* schedule */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:16px}
.seg button{min-height:46px;border-radius:10px;font-weight:800;color:var(--sub)}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.part{margin:22px 0 8px}
.part .pn{font-size:22px;font-weight:900;color:var(--navy-t)}
.part .pr{font-size:15px;color:var(--sub)}
.sitem{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg);scroll-margin-top:90px;scroll-margin-bottom:100px}
.sitem .hd{width:100%;text-align:left;padding:12px 14px;display:block}
.sitem .tm{font-weight:800;font-size:16px;color:var(--navy-t)}
.sitem .ti{font-size:18px;font-weight:700;margin:1px 0}
.sitem .pl{font-size:14px;color:var(--sub)}
.sitem .ex{display:none;padding:0 14px 12px}
.sitem.open .ex{display:block}
.sitem.can .hd::after{content:"주제, 팀원 보기";float:right;font-size:13px;color:var(--sub)}
.sitem.can.open .hd::after{content:"접기"}
.sitem.past{opacity:.5}
.sitem.now{border-color:var(--green);border-left-color:var(--green);background:var(--green-bg);opacity:1}
.sitem.now .tm{color:var(--green)}
.sitem.nxt{border-left-color:var(--navy)}
.ex .row{padding:8px 0;border-top:1px solid var(--line)}
.ex .row.m{background:var(--orange-bg);border-radius:8px;padding:8px;margin-top:4px;border-top:0}
.red{color:var(--red);font-weight:800;font-size:17px;margin:2px 0}
.tp{font-size:18px;font-weight:700;line-height:1.45}
.tmem{font-size:18px;padding:2px 0}
.ex .eh{font-weight:800;font-size:15px;color:var(--navy-t);margin:8px 0 2px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 10px}
.steps div{background:var(--card);border-radius:10px;padding:8px 2px;text-align:center;font-weight:800;font-size:14px;line-height:1.25}
.steps i{display:block;font-style:normal;font-size:13px;color:var(--navy-t)}
.reh{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.reh.past{opacity:.5}
.reh.next{border-color:var(--orange);background:var(--orange-bg)}
.reh .rd{font-size:20px;font-weight:800}
.reh .rt{font-size:18px;font-weight:700;color:var(--navy-t)}

/* todo */
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--green)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task.plain{display:block}
.cb{flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:3px solid var(--navy);position:relative;background:var(--bg)}
.task.done .cb{background:var(--green);border-color:var(--green)}
.task.done .cb::after{content:"";position:absolute;left:11px;top:4px;width:10px;height:18px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.task.done .tt{text-decoration:line-through;color:var(--sub)}
.task .tt{font-size:18px;font-weight:700}
.task .tw{flex:1;min-width:0}
.when{font-size:14px;color:var(--sub)}
.when.soon{color:var(--orange);font-weight:800}
.big-btn{width:100%;min-height:54px;border-radius:14px;background:var(--navy);color:var(--on-navy);font-weight:800;font-size:18px;margin:14px 0}
.big-btn.line{background:var(--bg);color:var(--navy-t);border:2px solid var(--navy)}
.empty{text-align:center;padding:36px 12px;color:var(--sub);font-size:18px}
.dept{margin-top:20px}
.dept .dh{font-weight:900;font-size:19px;color:var(--navy-t);border-bottom:2px solid var(--navy);padding-bottom:4px}

/* notices */
.nt{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.nt.pin{border-color:var(--navy);background:var(--card)}
.nt .ntt{font-weight:800;font-size:18px}
.nt .ntd{font-size:13px;color:var(--sub)}
.cnts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pg{padding:10px 0;border-top:1px solid var(--line)}
.pg .ptype{font-weight:800}
ol.ag{padding-left:24px;margin:6px 0}
ol.ag li{padding:5px 0;font-size:18px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   데이터 영역. 여기 내용만 고치면 앱 전체가 바뀝니다.
   who: 이름 직접 지정, dept: 부서 지정(그 부서 소속 멤버에게 자동 배정)
   members의 depts에 부서를 넣으면 그 부서 일이 그 사람에게 바로 연결됩니다.
   ============================================================ */

const EVENT = { date: "2026-11-26", title: "국제통상학과 학술제", school: "중부대학교" };

/* 학생회 13명. depts가 비어 있으면 부서 확인 필요 */
const members = [
  { name: "현재", title: "", depts: [] },
  { name: "소민", title: "", depts: [] },
  { name: "화윤", title: "", depts: [] },
  { name: "은채", title: "", depts: [] },
  { name: "태완", title: "", depts: [] },
  { name: "준규", title: "", depts: [] },
  { name: "시우", title: "", depts: [] },
  { name: "민재", title: "", depts: [] },
  { name: "민서", title: "", depts: [] },
  { name: "유빈", title: "", depts: [] },
  { name: "태연", title: "", depts: [] },
  { name: "세라", title: "", depts: [] },
  { name: "서영", title: "", depts: [] }
  /* 부학회장은 아직 미정. 정해지면 해당 사람의 depts에 "부학회장"을 넣으면 됩니다 */
];

/* 시간대 묶음. 시간표 항목과 할 일을 g 값으로 연결 */
const groups = [
  { id: "enter", name: "입장과 출석체크", time: "08:45", start: 525, part: "1부" },
  { id: "open",  name: "입장과 오프닝", time: "09:00", start: 540, part: "1부" },
  { id: "talk",  name: "발표 시간 (1부, 2부 공통)", time: "10:00", start: 600, part: "1부" },
  { id: "snack", name: "간식 픽업과 배부", time: "11:00", start: 660, part: "1부" },
  { id: "vote",  name: "학술팀 투표", time: "15:40", start: 940, part: "2부" },
  { id: "rank",  name: "순위 집계", time: "15:55", start: 955, part: "2부" },
  { id: "fee",   name: "학회비 발표", time: "15:55", start: 956, part: "2부" },
  { id: "award", name: "수상식과 사진촬영", time: "16:00", start: 960, part: "2부" },
  { id: "elect", name: "과대 투표", time: "16:15", start: 975, part: "2부" },
  { id: "chair", name: "학회장 투표", time: "16:45", start: 1005, part: "2부" },
  { id: "trans", name: "1부 끝난 뒤", time: "11:40", start: 700, part: "1부" },
  { id: "part2", name: "2부 시작 전", time: "13:00", start: 780, part: "2부" },
  { id: "party", name: "종강파티", time: "18:00", start: 1080, part: "종강파티" }
];

const parts = [
  { id: "p1",  name: "1부", range: "09:00~11:40", place: "세종관 512호" },
  { id: "tr",  name: "점심시간", range: "11:40~13:00", place: "" },
  { id: "p2",  name: "2부", range: "13:00~17:05", place: "세종관 312호" },
  { id: "eve", name: "종강파티", range: "18:00~", place: "신원마을 명륜진사갈비" }
];

/* 당일 시간표. at이 있으면 마감형 항목(시간 진행 판정에서 제외) */
const schedule = [
  { id: "s1", part: "p1", start: "09:00", end: "09:30", title: "출석체크, 전원 착석 완료", g: "open", tbd: true, note: "출석 종이는 조교님" },
  { id: "s2", part: "p1", start: "09:30", end: "10:00", title: "학과장 인사말, 교수님 소개, 이어서 오늘 진행 흐름 설명", g: "open", ext: "학과장", dept: ["학회장"] },
  { id: "s3", part: "p1", start: "10:00", end: "10:30", title: "1팀 발표, 질의응답", g: "talk", team: "1-1" },
  { id: "s4", part: "p1", start: "10:35", end: "11:05", title: "2팀 발표, 질의응답", g: "talk", team: "1-2" },
  { id: "s5", part: "p1", start: "11:10", end: "11:40", title: "3팀 발표, 질의응답", g: "talk", team: "1-3" },

  { id: "s6", part: "tr", start: "11:40", end: "12:00", title: "1부 종료, 간식 배부, 512호 정리", g: "trans", dept: ["과대"], place: "세종관 512호", note: "간식 수량은 총무부" },
  { id: "s7", part: "tr", start: "12:00", end: "13:00", title: "점심시간 (자유)", place: "" },
  { id: "s8", part: "tr", at: "13:00", label: "13:00 전", title: "2부 장비와 짐을 312호로 이동", g: "trans", tbd: true, alert: "학생회는 12시 50분까지 312호 앞으로 모이기", place: "512호에서 312호로" },

  { id: "s9",  part: "p2", start: "13:00", end: "13:20", title: "2부 출석체크, 전원 착석", g: "part2", tbd: true },

  { type: "미정", text: "추가 간식 계획" }
];

/* ============================================================
   여기부터는 앱 코드
   ============================================================ */

const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = x => x == null ? [] : Array.isArray(x) ? x : [x];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* 주소 뒤에 ?now=2026-11-26T10:30 을 붙이면 그 시각인 것처럼 테스트할 수 있어요 */
const OFFSET = (() => {
  try {
    const p = new URLSearchParams(location.search).get("now");
    if (!p) return 0;
    const t = new Date(p).getTime();
    return isNaN(t) ? 0 : t - Date.now();
  } catch (e) { return 0; }
})();
const now = () => new Date(Date.now() + OFFSET);

const mm = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (a, b) => Math.round((midnight(b) - midnight(a)) / 864e5);
const fmtMD = s => { const d = parseD(s); return (d.getMonth() + 1) + "/" + d.getDate() + " " + DOW[d.getDay()]; };
const fmtDur = m => m < 60 ? m + "분" : (m % 60 ? Math.floor(m / 60) + "시간 " + (m % 60) + "분" : Math.floor(m / 60) + "시간");

const state = {
  name: store.get("hh_name", null),
  done: store.get("hh_done2", {}),
  infoOpen: {}, tab: "home", sMode: null, open: {}, full: false, pend: false, picking: false, scrollNow: true
};
if (!members.some(m => m.name === state.name)) state.name = null;

/* 다크 모드. 직접 고른 값이 있으면 그것을 쓰고, 없으면 폰 설정을 따라갑니다 */
state.theme = store.get("hh_theme", null);
if (state.theme !== "light" && state.theme !== "dark") state.theme = null;
function applyTheme() { if (state.theme) document.documentElement.setAttribute("data-theme", state.theme); }
function isDark() {
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
}
applyTheme();

const gMap = {}; groups.forEach(g => gMap[g.id] = g);
const partMap = {}; parts.forEach(p => partMap[p.id] = p);
const gLabel = id => gMap[id] ? gMap[id].name : "";

/* 소유자 판정 */
const membersOf = d => members.filter(m => list(m.depts).includes(d)).map(m => m.name);
function ownerSet(it) {
  const s = new Set(list(it.who));
  list(it.dept).forEach(d => membersOf(d).forEach(n => s.add(n)));
  return s;
}
const isMine = it => !!state.name && (!!it.all || ownerSet(it).has(state.name));
const noOwner = it => !it.all && !it.ext && ownerSet(it).size === 0;
const missingDepts = it => list(it.dept).filter(d => !membersOf(d).length);

function chips(it, force) {
  const o = [];
  if (it.all) o.push('<span class="chip">학생회 전원</span>');
  list(it.ext).forEach(e => o.push('<span class="chip ext">' + esc(e) + '</span>'));
  list(it.who).forEach(n => o.push('<span class="chip' + (n === state.name ? " me" : "") + '">' + esc(n) + '</span>'));
  list(it.dept).forEach(d => {
    const ms = membersOf(d);
    if (!ms.length) { o.push('<span class="tbd">' + esc(d) + ' 미정</span>'); return; }
    const t = (ms.length === 1 && ms[0] === d) ? d : (ms.length <= 2 ? d + " " + ms.join(", ") : d);
    o.push('<span class="chip' + (ms.includes(state.name) ? " me" : "") + '">' + esc(t) + '</span>');
  });
  if (!o.length && force) o.push('<span class="tbd">담당 미정</span>');
  return o.length ? '<div class="owners">' + o.join("") + '</div>' : "";
}
const flagHtml = t => t.flag ? '<span class="flag">' + esc(t.flag) + '</span>' : "";

/* 완료 체크 */
const dkey = id => state.name + "|" + id;
const isDone = id => !!state.done[dkey(id)];

/* 시간표 계산 */
const TL = {};
(function () {
  const a = schedule.filter(s => !s.at);
  a.forEach((s, i) => {
    const s0 = mm(s.start);
    const s1 = s.end ? mm(s.end) : (a[i + 1] ? mm(a[i + 1].start) : 1440);
    TL[s.id] = { s0, s1 };
  });
})();
const timeline = () => schedule.filter(s => !s.at).map(s => Object.assign({}, s, TL[s.id]));
function dayState(n) {
  const d = dayDiff(n, parseD(EVENT.date));
  return d > 0 ? "before" : d === 0 ? "day" : "after";
}
function itemStatus(s, n, st) {
  if (st === "before") return "future";
  if (st === "after") return "past";
  const t = n.getHours() * 60 + n.getMinutes();
  if (s.at) return t >= mm(s.at) ? "past" : "future";
  const r = TL[s.id];
  return t >= r.s1 ? "past" : t >= r.s0 ? "now" : "future";
}
const timeText = s => s.at ? (s.label || s.at) : s.start + "~" + (s.end || "");
const placeOf = s => s.place !== undefined ? s.place : (partMap[s.part] ? partMap[s.part].place : "");
function titleHtml(s) {
  let h = esc(s.title);
  if (s.team) {
    const tm = teams.find(x => x.key === s.team);
    h += ' <span class="sub">팀명 ' + esc(tm && tm.name ? tm.name : "미정") + '</span>';
  }
  return h;
}

/* 할 일 묶음 */
const rolesAsTasks = () => roles.map(r => Object.assign({ ph: "day", title: "현장 역할: " + r.name, role: true }, r));
const allItems = () => tasks.concat(rolesAsTasks());
function mineAt(g) { return allItems().filter(t => t.g === g && isMine(t) && t.ph !== "post"); }

function whenText(t, n) {
  if (t.ph === "pre") {
    if (!t.due) return { txt: "사전 준비", soon: false };
    const d = dayDiff(n, parseD(t.due));
    const soon = d <= 3 && !isDone(t.id);
    return { txt: "기한 " + fmtMD(t.due) + (d < 0 ? ", 기한 지남" : d === 0 ? ", 오늘까지" : d <= 3 ? ", " + d + "일 남음" : ""), soon };
  }
  if (t.ph === "post") return { txt: "행사 후" + (t.g ? ", " + gLabel(t.g) : ""), soon: false };
  return { txt: gLabel(t.g), soon: false };
}

const partOf = t => (t.ph === "day" && gMap[t.g]) ? gMap[t.g].part : "";
const partTag = t => { const p = partOf(t); return (p === "1부" || p === "2부") ? '<span class="tag ' + (p === "1부" ? "" : "p2") + '">' + p + '</span> ' : ""; };
function taskRow(t, check, n) {
  const w = whenText(t, n);
  const body =
    '<div class="tw"><div class="tt">' + partTag(t) + esc(t.title) + '</div>' +
    (t.ph === "day" ? "" : '<div class="when' + (w.soon ? " soon" : "") + '">' + esc(w.txt) + '</div>') +
    (t.note ? '<div class="note">' + esc(t.note) + '</div>' : "") +
    (t.flag ? flagHtml(t) : "") +
    (check ? "" : chips(t, true)) + '</div>';
  if (!check) return '<div class="task plain">' + body + '</div>';
  return '<div class="task' + (isDone(t.id) ? " done" : "") + '">' +
    '<button class="cb" data-a="chk" data-id="' + t.id + '" aria-label="완료 표시"></button>' + body + '</div>';
}

/* ---------- 화면: 이름 선택 ---------- */
function viewPicker() {
  return '<div class="pick"><div class="sub">' + esc(EVENT.school + " " + EVENT.title) + '</div>' +
    '<h1>이름 선택</h1><div class="sub">내 이름을 눌러주세요</div>' +
    '<div class="grid2">' + members.map(m =>
      '<button class="nbtn' + (m.name === state.name ? " cur" : "") + '" data-a="pick" data-n="' + esc(m.name) + '">' + esc(m.name) +
      (m.title ? '<small>' + esc(m.title) + '</small>' : "") + '</button>').join("") + '</div>' +
    (state.name ? '<button class="ghost" data-a="cancelpick">취소</button>' : "") + '</div>';
}

/* ---------- 화면: 지금 ---------- */
function bigCard(kind, label, s, extra) {
  const mineList = s.g ? mineAt(s.g) : [];
  const own = isMine(s);
  let mine = "";
  if (own || mineList.length) {
    mine = '<div class="mine"><b>내가 맡은 일</b>' +
      (own ? '<div>이 순서는 내 담당이에요</div>' : "") +
      mineList.map(t => '<div>' + esc(t.title) + (t.ph === "pre" ? " (사전 준비)" : "") + '</div>').join("") + '</div>';
  }
  const pl = placeOf(s);
  return '<div class="big ' + kind + '"><div class="lbl">' + label + (extra ? " / " + extra : "") + '</div>' +
    '<div class="bt">' + esc(timeText(s)) + '</div><div class="bn">' + titleHtml(s) + '</div>' +
    (pl ? '<div class="bp">' + esc(pl) + '</div>' : "") + chips(s, s.tbd) +
    (s.note ? '<div class="note">' + esc(s.note) + '</div>' : "") + mine + '</div>';
}

function urgentHtml(n) {
  const u = tasks.filter(t => t.ph === "pre" && t.due && isMine(t) && !isDone(t.id) && dayDiff(n, parseD(t.due)) <= 3);
  if (!u.length) return "";
  return '<div class="warn"><b>마감 임박</b>' + u.map(t => '<div>' + esc(t.title) + ", " + esc(fmtMD(t.due)) + '</div>').join("") + '</div>';
}

function viewNow() {
  const n = now(), st = dayState(n), t = n.getHours() * 60 + n.getMinutes();
  const dd = dayDiff(n, parseD(EVENT.date));
  let h = "";
  const ddHtml = '<div class="dday"><div class="dl">' + esc(EVENT.title) + '</div><div class="dd">' +
    (dd > 0 ? "D-" + dd : dd === 0 ? "D-DAY" : "끝") + '</div><div class="dl">' + esc(fmtMD(EVENT.date).replace(/ /, "일 ").replace("/", "월 ")) + '요일</div></div>';

  if (st === "day") {
    const tl = timeline();
    const cur = tl.find(s => s.s0 <= t && t < s.s1);
    const nxt = tl.find(s => s.s0 > t);
    if (cur) h += bigCard("now", "지금", cur, "끝까지 " + fmtDur(cur.s1 - t) + (cur.s1 >= 1440 ? "" : ""));
    else if (nxt && t < tl[0].s0) h += '<div class="big"><div class="lbl">지금</div><div class="bn">아직 시작 전이에요</div></div>';
    else if (nxt) h += '<div class="big"><div class="lbl">지금</div><div class="bn">이동, 교체 시간이에요</div></div>';
    else h += '<div class="big"><div class="lbl">지금</div><div class="bn">오늘 일정이 모두 끝났어요</div></div>';
    if (nxt) h += bigCard("nxt", "다음", nxt, fmtDur(nxt.s0 - t) + " 후");
    const dl = schedule.find(s => s.at && mm(s.at) > t);
    if (dl) h += '<div class="warn"><b>' + esc(dl.label || dl.at) + '</b> ' + esc(dl.title) + (dl.tbd ? ' <span class="tbd">담당 미정</span>' : "") + '</div>';
    const wr = parts.find(p => p.warn && cur && cur.part === p.id);
    if (wr) h += '<div class="warn"><b>주의</b> ' + esc(wr.warn) + '</div>';
  } else if (st === "before") {
    h += ddHtml;
    const nr = rehearsals.map(r => Object.assign({ endAt: new Date(parseD(r.date).getTime() + mm(r.end) * 6e4) }, r)).filter(r => r.endAt > n);
    if (nr.length) {
      const r = nr[0], d = dayDiff(n, parseD(r.date));
      h += '<div class="big nxt"><div class="lbl">다음 일정, 리허설' + (d === 0 ? ", 오늘" : d === 1 ? ", 내일" : ", " + d + "일 후") + '</div>' +
        '<div class="bt">' + esc(fmtMD(r.date)) + " " + r.start + '~' + r.end + '</div><div class="bn">' + esc(r.target) + '</div>' +
        '<div class="bp">' + esc(r.room) + '</div>' + chips(rehearsalMeta, true) + '</div>';
      if (nr.length > 1) h += '<div class="card"><h3>그 다음 리허설</h3>' + nr.slice(1).map(x =>
        '<div>' + esc(fmtMD(x.date)) + " " + x.start + '~' + x.end + ", " + esc(x.room) + ", " + esc(x.target) + '</div>').join("") + '</div>';
    } else {
      const f = timeline()[0];
      h += bigCard("nxt", "다음 일정, 학술제 당일", f);
    }
  } else {
    h += ddHtml + '<div class="big"><div class="bn">학술제가 끝났어요, 수고하셨습니다</div></div>';
  }
  h += urgentHtml(n);
  return h;
}

/* ---------- 화면: 시간표 ---------- */
function groupedByDept(filterFn) {
  const order = ["학회장", "부학회장", "학술부", "기획부", "총무부", "과대", "개인 지정", "조교님", "전원", "담당 미정"];
  const map = {}; order.forEach(k => map[k] = []);
  tasks.filter(filterFn).forEach(t => {
    const d = list(t.dept)[0];
    let k;
    if (d) k = order.includes(d) ? d : "담당 미정";
    else if (t.all) k = "전원";
    else if (list(t.who).length) k = "개인 지정";
    else if (t.ext) k = "조교님";
    else k = "담당 미정";
    map[k].push(t);
  });
  return order.filter(k => map[k].length).map(k => ({ k, items: map[k] }));
}
function deptHeader(k) {
  const ms = membersOf(k);
  const nm = ms.length ? ' <span class="sub">' + esc(ms.join(", ")) + '</span>' : (["학회장", "부학회장", "학술부", "기획부", "총무부", "과대"].includes(k) ? ' <span class="tbd">미정</span>' : "");
  return '<div class="dh">' + esc(k) + nm + '</div>';
}

function viewPrep(n) {
  let h = '<h2>리허설</h2>' + chips(rehearsalMeta, true) + '<div class="note">' + esc(rehearsalMeta.note) + '</div><div style="height:8px"></div>';
  let nextMarked = false;
  rehearsals.forEach(r => {
    const endAt = new Date(parseD(r.date).getTime() + mm(r.end) * 6e4);
    const past = endAt <= n;
    const cls = past ? " past" : (!nextMarked ? " next" : "");
    if (!past) nextMarked = true;
    h += '<div class="reh' + cls + '"><div class="rd">' + esc(fmtMD(r.date)) + '</div><div class="rt">' + r.start + '~' + r.end + '</div>' +
      '<div>' + esc(r.room) + ' <span class="tag">' + esc(r.target) + '</span>' + (cls === " next" ? ' <span class="tag org">다음</span>' : "") + '</div></div>';
  });
  h += '<h2>부서별 사전 준비</h2>';
  groupedByDept(t => t.ph === "pre").forEach(gr => {
    h += '<div class="dept">' + deptHeader(gr.k) + gr.items.map(t =>
      '<div class="task plain"><div class="tt">' + esc(t.title) + '</div>' +
      (t.due ? '<div class="when">기한 ' + esc(fmtMD(t.due)) + '</div>' : "") +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : "") + flagHtml(t) +
      ((list(t.dept).length === 0 || gr.k === "개인 지정" || gr.k === "조교님") ? chips(t, true) : "") + '</div>').join("") + '</div>';
  });
  return h;
}

function expandHtml(s) {
  let h = "";
  if (s.note) h += '<div class="note">' + esc(s.note) + '</div>';
  if (s.g) {
    const ts = tasks.filter(t => t.g === s.g);
    const rs = roles.filter(r => r.g === s.g);
    if (ts.length || rs.length) {
      h += '<div class="eh">학생회 할 일</div>';
      ts.forEach(t => {
        h += '<div class="row' + (isMine(t) ? " m" : "") + '"><b>' + esc(t.title) + '</b>' +
          (t.ph === "pre" ? ' <span class="sub">사전 준비</span>' : t.ph === "post" ? ' <span class="sub">행사 후</span>' : "") +
          (t.note ? '<div class="note">' + esc(t.note) + '</div>' : "") + flagHtml(t) + chips(t, true) + '</div>';
      });
      rs.forEach(r => {
        const it = Object.assign({ ph: "day" }, r);
        h += '<div class="row' + (isMine(it) ? " m" : "") + '"><b>현장 역할: ' + esc(r.name) + '</b>' + chips(it, true) + '</div>';
      });
    }
  }
  return h;
}

function viewSched() {
  const n = now(), st = dayState(n);
  let h = "", marked = false;
  parts.forEach(p => {
    h += '<div class="part"><div class="pn">' + esc(p.name) + '</div><div class="pr">' + esc(p.range) + (p.place ? ", " + esc(p.place) : "") + '</div></div>';
    schedule.filter(s => s.part === p.id).forEach(s => {
      const status = itemStatus(s, n, st);
      let cls = status === "past" ? "past" : status === "now" ? "now" : "";
      if (status === "future" && st === "day" && !marked && !s.at) { cls = "nxt"; marked = true; }
      const pl0 = placeOf(s), pl = pl0 === p.place ? "" : pl0;
      const tm = s.team ? teams.find(x => x.key === s.team) : null;
      const open = tm && state.open[s.id];
      h += '<div class="sitem ' + cls + (tm ? " can" : "") + (open ? " open" : "") + '" id="si-' + s.id + '">' +
        (tm ? '<button class="hd" data-a="tog" data-id="' + s.id + '">' : '<div class="hd">') +
        '<div class="tm">' + esc(timeText(s)) + (status === "now" ? ' <span class="tag green">진행 중</span>' : cls === "nxt" ? ' <span class="tag">다음</span>' : "") + '</div>' +
        '<div class="ti">' + esc(s.title) + '</div>' + (s.alert ? '<div class="red">' + esc(s.alert) + '</div>' : "") + (pl ? '<div class="pl">' + esc(pl) + '</div>' : "") + (tm ? '</button>' : '</div>') +
        (tm ? '<div class="ex"><div class="eh">발표 주제</div><div class="tp">' + esc(tm.topic) + '</div><div class="eh">팀원</div>' +
          tm.members.map(m => '<div class="tmem">' + esc(m) + '</div>').join("") + '</div>' : "") + '</div>';
    });
  });
  return h;
}

/* ---------- 화면: 내 할 일 ---------- */
function viewTodo() {
  const n = now();
  if (state.full) {
    let h = '<button class="big-btn line" data-a="full">내 할 일만 보기</button><h2>전체 역할</h2>';
    if (!tasks.length) return h + '<div class="empty">아직 배정된 일이 없어요</div>';
    const byG = (a, b) => (gMap[a.g] ? gMap[a.g].start : 0) - (gMap[b.g] ? gMap[b.g].start : 0);
    const secs = [
      ["사전 준비", tasks.filter(t => t.ph === "pre")],
      ["1부", tasks.filter(t => partOf(t) === "1부").sort(byG)],
      ["2부", tasks.filter(t => partOf(t) === "2부").sort(byG)],
      ["종강파티", tasks.filter(t => partOf(t) === "종강파티").sort(byG)],
      ["행사 후", tasks.filter(t => t.ph === "post")]
    ];
    secs.forEach(([nm, arr]) => {
      if (!arr.length) return;
      h += '<div class="dept"><div class="dh">' + nm + '</div>';
      let last = null;
      arr.forEach(t => {
        if (t.g !== last && gMap[t.g]) { h += '<div class="eh" style="margin-top:12px;font-weight:800;color:var(--navy-t)">' + esc(gMap[t.g].name) + '</div>'; }
        last = t.g;
        h += '<div class="task plain"><div class="tt">' + esc(t.title) + '</div>' + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : "") + chips(t, true) + '</div>';
      });
      h += '</div>';
    });
    return h;
  }
  const mine = allItems().filter(isMine);
  const done = mine.filter(t => isDone(t.id)).length;
  let h = '<h2>' + esc(state.name) + ' 님의 할 일</h2>';
  if (!mine.length) {
    h += '<div class="empty">아직 배정된 할 일이 없어요<div class="sub" style="margin-top:6px">담당자가 정해지면 여기에 나와요</div></div>';
  } else {
    h += '<div class="sub">완료 ' + done + ' / ' + mine.length + '</div><div class="prog"><i style="width:' + Math.round(done / mine.length * 100) + '%"></i></div>';
    const idx = t => allItems().indexOf(allItems().find(x => x.id === t.id));
    const sec = [
      ["사전 준비", mine.filter(t => t.ph === "pre").sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"))],
      ["당일", mine.filter(t => t.ph === "day").sort((a, b) => (gMap[a.g] ? gMap[a.g].start : 0) - (gMap[b.g] ? gMap[b.g].start : 0))],
      ["행사 후", mine.filter(t => t.ph === "post")]
    ];
    sec.forEach(([nm, arr]) => {
      if (!arr.length) return;
      h += (nm === "당일" ? '<div style="height:8px"></div>' : '<h2>' + nm + '</h2>') + arr.map(t => taskRow(t, true, n)).join("");
    });
  }
  h += '<button class="big-btn" data-a="full">전체 할 일 보기</button>';
  return h;
}

/* ---------- 화면: 알아둘 것 ---------- */
/* "이름: 내용" 형태의 줄을 이름(작은 글씨)과 내용(큰 글씨)으로 나눠서 보여줌. 내용 끝의 (괄호)는 작은 설명으로 따로 뺌 */
function infoLine(l) {
  const m = l.match(/^([^:]+):\s*(.+)$/);
  const tbd = t => esc(t).replace(/미정/g, '<span class="tbd">미정</span>');
  if (!m) return '<div class="il"><div class="in">' + tbd(l) + '</div></div>';
  let val = m[2], note = "";
  const pm = val.match(/^(.*?)\s*\((.+)\)$/);
  if (pm) { val = pm[1]; note = pm[2]; }
  return '<div class="il"><div class="ik">' + tbd(m[1]) + '</div><div class="iv">' + tbd(val) + '</div>' + (note ? '<div class="in">' + tbd(note) + '</div>' : "") + '</div>';
}
/* 312호 투표용지 배부 구역 그림. 무대에서 학생석을 바라본 모습이라 왼쪽, 오른쪽이 말 그대로 무대에서 본 방향입니다 */
function voteMap() {
  let seats = "";
  [124, 174, 224, 274, 324].forEach(cy => {
    for (let i = 0; i < 6; i++) {
      [32, 192].forEach(x0 => {
        seats += '<rect x="' + (x0 + i * 24) + '" y="' + (cy - 7) + '" width="16" height="14" rx="4" fill="var(--orange)" fill-opacity=".6"/>';
      });
    }
  });
  return '<div class="vm"><svg viewBox="0 0 360 430" role="img" aria-label="312호 투표용지 배부와 회수 구역">' +
    '<rect x="20" y="24" width="160" height="330" fill="#7a5af8" fill-opacity=".2"/>' +
    '<rect x="180" y="24" width="160" height="330" fill="var(--navy)" fill-opacity=".25"/>' + seats +
    '<rect x="20" y="24" width="320" height="330" rx="6" fill="none" stroke="var(--text)" stroke-width="2.5"/>' +
    '<line x1="180" y1="24" x2="180" y2="354" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 4"/>' +
    '<line x1="20" y1="94" x2="340" y2="94" stroke="var(--text)" stroke-opacity=".35" stroke-width="1.5"/>' +
    '<g font-size="16" font-weight="700" text-anchor="middle" fill="var(--sub)"><text x="100" y="42">왼쪽</text><text x="260" y="42">오른쪽</text></g>' +
    '<g font-size="19" font-weight="800" text-anchor="middle" fill="var(--text)"><text x="100" y="64">나눠주기 시우</text><text x="260" y="64">나눠주기 세라</text>' +
    '<text x="100" y="86">회수 화윤</text><text x="260" y="86">회수 태연</text></g>' +
    '<text x="180" y="16" font-size="16" font-weight="700" text-anchor="middle" fill="var(--sub)">뒤쪽</text>' +
    '<rect x="20" y="364" width="320" height="46" rx="8" fill="var(--navy)"/>' +
    '<text x="180" y="394" font-size="24" font-weight="800" text-anchor="middle" fill="#fff">무대 (앞)</text></svg>' +
    '<div class="vl"><span class="sw" style="background:#7a5af8"></span><span><b>시우</b> 무대에서 봤을 때 왼쪽 학생들에게 투표용지 나눠주기</span></div>' +
    '<div class="vl"><span class="sw" style="background:#7a5af8"></span><span><b>화윤</b> 왼쪽 투표용지를 앞쪽부터 투표함에 가져오기</span></div>' +
    '<div class="vl"><span class="sw" style="background:var(--navy)"></span><span><b>세라</b> 무대에서 봤을 때 오른쪽 학생들에게 투표용지 나눠주기</span></div>' +
    '<div class="vl"><span class="sw" style="background:var(--navy)"></span><span><b>태연</b> 오른쪽 투표용지를 앞쪽부터 투표함에 가져오기</span></div>' +
    '<div class="in" style="margin-top:6px">312호를 직사각형 계단식 강당으로 본 그림이고, 무대에서 학생석을 바라본 모습이에요</div></div>';
}
function viewInfo() {
  let h = '<h2>행사 정보</h2>';
  info.forEach((c, i) => {
    h += '<div class="acc' + (state.infoOpen[i] ? " open" : "") + '">' +
      '<button class="ah" data-a="itog" data-i="' + i + '"><span>' + esc(c.title) + '</span><i></i></button>' +
      '<div class="ab">' + c.lines.map(infoLine).join("") +
      (c.diagram === "vote" ? voteMap() : "") + (c.images || []).map(im => '<button class="bn" data-a="zoom" data-k="' + im.key + '"><div class="bl">' + esc(im.label) + '</div><img src="' + (BANNERS[im.key] || "") + '" alt="' + esc(im.label) + '"></button>').join("") + '</div></div>';
  });
  return h;
}

/* ---------- 화면: 공지 ---------- */
function pendingList() {
  const out = [];
  tasks.forEach(t => {
    const miss = missingDepts(t);
    const own = noOwner(t) || miss.length;
    if (t.flag) out.push({ type: t.flag, text: t.title + (t.note ? " (" + t.note + ")" : ""), sub: t.ph === "pre" ? "사전 준비" : gLabel(t.g), owner: own ? (noOwner(t) ? "담당 미정" : miss.join(", ") + " 미정") : "" });
    else if (own) out.push({ type: "담당 미정", text: t.title + (t.note ? " (" + t.note + ")" : ""), sub: t.ph === "pre" ? "사전 준비" : gLabel(t.g), owner: noOwner(t) ? "" : miss.join(", ") + " 미정" });
  });
  roles.forEach(r => { if (noOwner(r) || missingDepts(r).length) out.push({ type: "담당 미정", text: "현장 역할: " + r.name, sub: gLabel(r.g), owner: noOwner(r) ? "" : missingDepts(r).join(", ") + " 미정" }); });
  extraPending.forEach(e => out.push({ type: e.type, text: e.text, sub: "", owner: "" }));
  return out;
}

function viewNotice() {
  const ns = notices.map((x, i) => Object.assign({ i }, x)).sort((a, b) => (b.pinned - a.pinned) || b.date.localeCompare(a.date) || b.i - a.i);
  let h = '<h2>공지</h2>' + ns.map(x =>
    '<div class="nt' + (x.pinned ? " pin" : "") + '">' + (x.pinned ? '<span class="tag">중요</span> ' : "") +
    '<span class="ntt">' + esc(x.title) + '</span><div class="ntd">' + esc(fmtMD(x.date)) + '</div>' +
    '<div>' + (x.body === "미정" ? '<span class="tbd">미정</span>' : esc(x.body)) + '</div></div>').join("");

  const pl = pendingList();
  const types = ["담당 미정", "결정 필요", "확인 필요", "미정"];
  h += '<button class="big-btn line" data-a="pend">미정 모아보기 (' + pl.length + '개) ' + (state.pend ? "접기" : "펼치기") + '</button>';
  if (state.pend) {
    h += '<div class="note">담당자 이름은 코드 맨 위 배열에서 고치면 내 할 일에 바로 반영돼요</div>';
    h += '<div class="cnts">' + types.map(k => '<span class="flag">' + k + ' ' + pl.filter(p => p.type === k).length + '</span>').join("") + '</div>';
    types.forEach(k => {
      const arr = pl.filter(p => p.type === k);
      if (!arr.length) return;
      h += '<div class="dept"><div class="dh">' + k + ' (' + arr.length + ')</div>' + arr.map(p =>
        '<div class="pg"><div class="ptype">' + esc(p.text) + '</div>' +
        (p.sub ? '<div class="when">' + esc(p.sub) + '</div>' : "") +
        (p.owner ? '<span class="tbd">' + esc(p.owner) + '</span>' : (k === "담당 미정" ? '<span class="tbd">담당 미정</span>' : '<span class="flag">' + k + '</span>')) + '</div>').join("") + '</div>';
    });
  }
  h += '<h2>장소 정보</h2>' + places.map(p =>
    '<div class="card"><h3>' + esc(p.name) + '</h3>' + p.lines.map(l => '<div class="note">' + esc(l) + '</div>').join("") + '</div>').join("");
  h += '<h2>다음 회의에서 정할 것</h2><ol class="ag">' + agenda.map(a => '<li>' + esc(a) + '</li>').join("") + '</ol>';
  return h;
}

/* ---------- 렌더 ---------- */
const ICONS = {
  moon: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  now: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sched: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  todo: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
  notice: '<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>'
};
/* 첫 화면: 큰 버튼 두 개만 */
function viewHome(n, dd) {
  let planSub = dd > 0 ? "D-" + dd + ", 리허설과 당일 순서" : "오늘 순서와 리허설";
  if (dayState(n) === "day") {
    const t = n.getHours() * 60 + n.getMinutes();
    const cur = timeline().find(s => s.s0 <= t && t < s.s1);
    if (cur) planSub = "지금 " + cur.title;
  }
  const mine = allItems().filter(isMine);
  const left = mine.filter(x => !isDone(x.id)).length;
  const roleSub = mine.length ? "남은 일 " + left + "개" : "아직 배정된 일이 없어요";
  return '<div class="home">' +
    '<button class="hbtn" data-a="tab" data-t="sched">' + ICONS.sched + '<b>시간표</b></button>' +
    '<button class="hbtn alt" data-a="tab" data-t="todo">' + ICONS.todo + '<b>역할확인</b><span>' + esc(state.name) + ' 님, ' + esc(roleSub) + '</span></button>' +
    '<button class="hbtn alt" data-a="tab" data-t="info">' + ICONS.info + '<b>행사 정보</b><span>장소, 간식, 투표 방식</span></button></div>';
}

function render(keep) {
  const app = document.getElementById("app");
  const y = window.scrollY;
  if (!state.name || state.picking) { app.innerHTML = viewPicker(); window.scrollTo(0, 0); return; }
  const n = now();
  const dd = dayDiff(n, parseD(EVENT.date));
  let v = state.tab === "home" ? viewHome(n, dd) : state.tab === "sched" ? viewSched() : state.tab === "todo" ? viewTodo() : state.tab === "info" ? viewInfo() : viewNotice();
  if (state.tab !== "home") v = '<button class="back" data-a="tab" data-t="home">&larr; 처음으로</button>' + v;
  app.innerHTML =
    '<div class="top"><div><div class="t1">' + esc(EVENT.title) + '</div><div class="t2">11월 26일 목요일</div></div>' +
    '<div class="hr"><button class="tg" data-a="theme" aria-label="' + (isDark() ? "라이트 모드로 바꾸기" : "다크 모드로 바꾸기") + '">' + (isDark() ? ICONS.sun : ICONS.moon) + '</button>' +
    '<button class="who" data-a="chname">' + esc(state.name) + '</button></div>' +
    (state.menu ? '<div class="menu">' + members.map(m => '<button class="mi' + (m.name === state.name ? ' cur' : '') + '" data-a="pick" data-n="' + esc(m.name) + '">' + esc(m.name) + (m.title ? '<small>' + esc(m.title) + '</small>' : '') + '</button>').join('') + '</div>' : '') + '</div>' +
    '<main>' + v + '</main>';
  if (keep) window.scrollTo(0, y);
  if (state.scrollNow && state.tab === "sched") {
    state.scrollNow = false;
    const el = document.querySelector(".sitem.now") || document.querySelector(".sitem.nxt");
    if (el) el.scrollIntoView({ block: "center" });
  }
}

document.addEventListener("click", e => {
  if (state.menu && !e.target.closest(".menu,.who")) { state.menu = false; render(true); return; }
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;
  if (a === "pick") { state.name = b.dataset.n; state.picking = false; state.menu = false; store.set("hh_name", state.name); state.tab = "home"; render(); window.scrollTo(0, 0); }
  else if (a === "theme") { state.theme = isDark() ? "light" : "dark"; store.set("hh_theme", state.theme); applyTheme(); render(true); }
  else if (a === "chname") { state.menu = !state.menu; render(true); }
  else if (a === "cancelpick") { state.picking = false; render(); }
  else if (a === "tab") { state.tab = b.dataset.t; state.scrollNow = true; state.full = false; window.scrollTo(0, 0); render(); }
  else if (a === "smode") { state.sMode = b.dataset.m; state.scrollNow = true; window.scrollTo(0, 0); render(); }
  else if (a === "tog") {
    const el = b.closest(".sitem");
    if (!el.classList.contains("can")) return;
    el.classList.toggle("open");
    state.open[b.dataset.id] = el.classList.contains("open");
  }
  else if (a === "chk") { const k = dkey(b.dataset.id); state.done[k] = !state.done[k]; store.set("hh_done2", state.done); render(true); }
  else if (a === "zoom") { const o = document.createElement("div"); o.className = "lb"; o.innerHTML = '<button class="lbx" data-a="lbclose">닫기</button><div class="lbs"><img src="' + (BANNERS[b.dataset.k] || "") + '"></div>'; document.body.appendChild(o); }
  else if (a === "lbclose") { const o = document.querySelector(".lb"); if (o) o.remove(); }
  else if (a === "itog") { const el = b.closest(".acc"); el.classList.toggle("open"); state.infoOpen[b.dataset.i] = el.classList.contains("open"); }
  else if (a === "full") { state.full = !state.full; window.scrollTo(0, 0); render(); }
  else if (a === "pend") { state.pend = !state.pend; render(true); }
});

setInterval(() => { if (state.name && !state.picking && (state.tab === "home" || state.tab === "sched")) render(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.name && !state.picking) render(true); });
render();
</script>
